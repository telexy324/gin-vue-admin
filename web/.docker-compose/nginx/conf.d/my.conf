server {
    listen       8080;
    server_name localhost;
    client_max_body_size 10G;
    #charset koi8-r;
    #access_log  logs/host.access.log  main;

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        try_files $uri $uri/ /index.html;
    }

    # 1. 处理 /api 路径的代理（仅基础代理，无WebSocket配置）
    location ^~ /api/ {
        # 通用代理头配置（保留原有所有头信息）
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 原有/api路径的重写规则（保留）
        rewrite ^/api/(.*)$ /$1 break;

        # 代理后端地址（与原配置一致）
        proxy_pass http://177.7.0.12:8888;
    }

    # 2. 处理 /ssh/run 路径的代理（启用WebSocket支持）
    location ^~ /ssh/run/ {
        # 通用代理头配置
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 核心支持配置（仅此处和task/ws生效）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 补充：解决WebSocket断联的超时配置（必加，否则仍会60s断联）
        proxy_read_timeout 86400s;  # 读取超时设为1天，可根据业务调整
        proxy_send_timeout 86400s;  # 发送超时与读取超时一致
        proxy_buffering off;        # 禁用缓冲，适配WebSocket实时流

        # 代理后端地址（无需重写，直接代理）
        proxy_pass http://177.7.0.12:8888;
    }

    # 3. 处理 /task/ws 路径的代理（启用WebSocket支持）
    location ^~ /task/ws/ {
        # 通用代理头配置
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 核心支持配置
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 同样添加超时和缓冲配置，避免WebSocket断联
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;

        # 代理后端地址（无需重写，直接代理）
        proxy_pass http://177.7.0.12:8888;
    }

    location /api/swagger/index.html {
        proxy_pass http://127.0.0.1:8888/swagger/index.html;
     }
 }